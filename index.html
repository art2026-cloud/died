<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>純白凝視：無盡飄零 | 極致沈浸系統 (WebGL引擎)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- 引入 WebGL 引擎 Three.js 解決效能瓶頸 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- 更改為引入 Noto Serif TC (明體) -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Serif+TC:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #f8f8f8;
            overflow: hidden;
            /* 更改字體設定為明體 */
            font-family: 'Noto Serif TC', serif;
            user-select: none;
            cursor: none; 
        }

        /* 啟動畫面 */
        #standby-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 100; background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #111; cursor: pointer; transition: opacity 1.5s ease;
            font-family: 'Courier Prime', monospace;
        }

        /* 3D WebGL 畫布容器 */
        #scene-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10;
        }

        /* 視覺氛圍層 (白化) */
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; pointer-events: none;
            background: radial-gradient(circle at center, transparent 20%, rgba(255,255,255,0.98) 100%);
        }

        #scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.04) 51%);
            background-size: 100% 4px;
            z-index: 25; pointer-events: none; opacity: 0.8;
        }

        #noise {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.06; z-index: 26; pointer-events: none; mix-blend-mode: multiply;
        }

        /* 文字層 */
        #text-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            pointer-events: none;
        }

        .text-content {
            font-size: 8vw;
            /* 調整文字權重，配合明體的優雅感 */
            font-weight: 700; 
            letter-spacing: 0.2em;
            color: #050505;
            line-height: 1.4;
            white-space: pre-wrap;
            text-align: center;
            mix-blend-mode: multiply;
            text-shadow: 0 10px 30px rgba(0,0,0,0.1), 0 0 50px rgba(200, 0, 0, 0.2);
            opacity: 0;
            will-change: transform, opacity, filter;
        }
        
        #hotkey-hint {
            position: fixed; bottom: 20px; right: 20px; z-index: 99;
            color: rgba(0,0,0,0.2); font-size: 10px; font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="standby-screen">
        <h1 class="text-3xl font-bold tracking-[0.5em] mb-4 text-black">WHITE ROOM PROTOCOL</h1>
        <p class="text-xs text-red-600 font-bold tracking-widest animate-pulse">[ 點擊任意處釋放檔案 ]</p>
        <p id="data-status" class="text-[10px] text-gray-400 mt-8 tracking-wider">正在載入系統資料...</p>
    </div>

    <div id="scene-container"></div>
    
    <div id="scanlines"></div>
    <div id="noise"></div>
    <div id="vignette"></div>
    
    <div id="text-layer">
        <div id="text-content" class="text-content"></div>
    </div>
    
    <div id="hotkey-hint">全螢幕: F</div>
    <audio id="bgm" src="1.mp3" loop></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD8ERvnrdHJzTAr7xDIdXuiqZ9o7d_wW_U",
            authDomain: "checkpoint-system-ee6d7.firebaseapp.com",
            projectId: "checkpoint-system-ee6d7",
            storageBucket: "checkpoint-system-ee6d7.firebasestorage.app",
            messagingSenderId: "188995102122",
            appId: "1:188995102122:web:6d8ef558b8c9f6262bf7d3"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sceneContainer = document.getElementById('scene-container');
        const bgm = document.getElementById('bgm');
        let heartSynth = null;
        
        // --- WebGL 系統變數 ---
        let scene, camera, renderer;
        let photoMeshes = [];
        const TOTAL_PHOTOS = 800; // 超級多的照片數量 (得益於 WebGL)

        // 白底壓迫風格的文字腳本
        const projectionScript = [
            "全部暴露在\n防空洞之中",
            "無所遁形的記憶",
            "我們是體制下的殘影",
            "被困在時代的深淵",
            "無盡的飄零",
            "凝視 不曾停止"
        ];
        let currentSubtitleIdx = 0;
        let textAnimationTl = null;

        // 將底圖、陰影、黑白濾鏡預先「烤」進 Texture 中，大幅節省 GPU 計算資源
        function bakeTexture(base64Src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 設定高解析度畫布
                    const w = 240; 
                    const h = 336;
                    const padding = 40;
                    canvas.width = w + padding * 2;
                    canvas.height = h + padding * 2;

                    // 1. 繪製重度陰影
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 25;
                    ctx.shadowOffsetX = 12;
                    ctx.shadowOffsetY = 12;
                    ctx.fillStyle = '#0a0a0a'; 
                    ctx.fillRect(padding, padding, w, h);

                    // 清除陰影設定避免影響後續繪製
                    ctx.shadowColor = 'transparent';

                    // 2. 繪製白色邊界(拍立得感)
                    const bw = 8;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(padding + bw, padding + bw, w - bw*2, h - bw*2);
                    
                    // 3. 繪製微黑白全彩照片 (加入 80% 灰階，保留一點點色彩與立體感)
                    ctx.filter = 'grayscale(80%) contrast(110%) brightness(1.05)'; 
                    
                    // 計算 object-fit: cover 的裁切比例，確保人臉絕不變形
                    const targetW = w - bw*2;
                    const targetH = h - bw*2;
                    const imgRatio = img.width / img.height;
                    const targetRatio = targetW / targetH;
                    let sx, sy, sw, sh;
                    
                    if (imgRatio > targetRatio) {
                        // 圖片較寬，裁切左右
                        sh = img.height;
                        sw = sh * targetRatio;
                        sx = (img.width - sw) / 2;
                        sy = 0;
                    } else {
                        // 圖片較高，裁切上下
                        sw = img.width;
                        sh = sw / targetRatio;
                        sx = 0;
                        sy = (img.height - sh) / 2;
                    }
                    
                    ctx.drawImage(img, sx, sy, sw, sh, padding + bw, padding + bw, targetW, targetH);

                    // 4. 外圍畫上細黑線
                    ctx.filter = 'none';
                    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(padding, padding, w, h);

                    const texture = new THREE.CanvasTexture(canvas);
                    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                    resolve(texture);
                };
                img.src = base64Src;
            });
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8f8f8);
            // 讓遠處的照片隱沒在純白的迷霧中，增加空間深度感
            // (調降 Fog 參數從 0.0006 改為 0.0004，讓遠處的臉也能看得更清楚)
            scene.fog = new THREE.FogExp2(0xf8f8f8, 0.0004);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 4000);
            camera.position.z = 0; // 相機位於原點

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 優化視網膜螢幕效能
            sceneContainer.appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        async function fetchRecords() {
            try {
                // 先初始化 WebGL 渲染器
                initThreeJS();

                const querySnapshot = await getDocs(collection(db, "archived_subjects"));
                let rawImages = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.imageData) rawImages.push(data.imageData);
                });

                // 過濾出不重複的圖片以節省記憶體
                const uniqueImages = [...new Set(rawImages)];
                if(uniqueImages.length === 0) throw new Error("無可用照片");

                // 將所有獨特圖片轉換為高效能 Texture
                const textures = await Promise.all(uniqueImages.map(bakeTexture));

                // 大量生成 3D 網格 (Mesh)
                const geometry = new THREE.PlaneGeometry(100, 124); // 基礎尺寸
                const materials = textures.map(tex => new THREE.MeshBasicMaterial({ 
                    map: tex, 
                    transparent: true 
                }));

                for (let i = 0; i < TOTAL_PHOTOS; i++) {
                    const mat = materials[Math.floor(Math.random() * materials.length)];
                    const mesh = new THREE.Mesh(geometry, mat);
                    
                    // 將照片散佈在一個廣大的 3D 隧道中
                    mesh.position.x = THREE.MathUtils.randFloatSpread(1800);
                    mesh.position.y = THREE.MathUtils.randFloatSpread(1200);
                    mesh.position.z = THREE.MathUtils.randFloatSpread(3000) - 1000; 

                    // 【修改重點 1】取消完全隨機的翻轉，改為永遠「正面朝向觀眾」
                    // 只給予極微小的隨機傾斜(約正負 5 度)，保留真實相紙在空間中的立體感
                    mesh.rotation.x = THREE.MathUtils.randFloatSpread(0.1);
                    mesh.rotation.y = THREE.MathUtils.randFloatSpread(0.1);
                    mesh.rotation.z = THREE.MathUtils.randFloatSpread(0.05);

                    // 【修改重點 2】拔除旋轉速度 (rx, ry, rz)，並降低側向飄動 (vx, vy)
                    // 讓視線更容易追蹤迎面而來的照片
                    mesh.userData = {
                        vx: THREE.MathUtils.randFloatSpread(0.2), // 降低側漂
                        vy: THREE.MathUtils.randFloatSpread(0.2), // 降低側漂
                        vz: Math.random() * 2.5 + 1.5 // 穩定向鏡頭飛來
                    };

                    scene.add(mesh);
                    photoMeshes.push(mesh);
                }

                const statusEl = document.getElementById('data-status');
                statusEl.innerText = "[ 檔案陣列已就緒 ]";
                statusEl.className = "text-[10px] text-green-600 mt-8 tracking-wider font-bold";
                
                document.getElementById('standby-screen').addEventListener('click', igniteSystem);
                
            } catch (error) {
                console.error("讀取失敗：", error);
                document.getElementById('data-status').innerText = "[ 嚴重錯誤：資料庫連線失敗 ]";
                document.getElementById('data-status').style.color = "red";
            }
        }
        
        fetchRecords();

        function igniteSystem() {
            const standby = document.getElementById('standby-screen');
            standby.style.opacity = '0';
            standby.style.pointerEvents = 'none';
            
            Tone.start();
            initToneAudio();
            bgm.volume = 0;
            bgm.play().catch(e => console.log("BGM Error:", e));
            gsap.to(bgm, { volume: 0.8, duration: 4 });

            setTimeout(() => {
                standby.remove();
                startSubtitles();
                animateLoop(); // 啟動 3D 渲染迴圈
            }, 1000);
        }

        function initToneAudio() {
            try {
                const reverb = new Tone.Reverb({ decay: 5, wet: 0.6 }).toDestination();
                heartSynth = new Tone.MembraneSynth({
                    envelope: { attack: 0.02, decay: 0.6, sustain: 0, release: 0.3 },
                    oscillator: { type: "sine" }
                }).connect(reverb);
                heartSynth.volume.value = -1;

                setInterval(() => {
                    heartSynth.triggerAttackRelease("C1", "8n");
                }, 1800); 
            } catch(e) {}
        }

        // WebGL 每秒 60 幀運算，徹底解決卡頓
        function animateLoop() {
            requestAnimationFrame(animateLoop);

            // 【修改重點 3】讓整個空間的搖晃感再減弱一半，避免暈眩與失焦
            camera.rotation.z = Math.sin(Date.now() * 0.0003) * 0.02;
            camera.rotation.x = Math.cos(Date.now() * 0.0002) * 0.02;

            photoMeshes.forEach(mesh => {
                // 應用速度
                mesh.position.x += mesh.userData.vx;
                mesh.position.y += mesh.userData.vy;
                mesh.position.z += mesh.userData.vz; // 向鏡頭逼近
                
                // (移除了原本這裡的 mesh.rotation 更新，讓照片不再無意義旋轉)

                // 如果照片飛過相機背後，將它瞬間傳送到遠方白霧中重新飛來
                if (mesh.position.z > 200) {
                    mesh.position.z = -3000;
                    mesh.position.x = THREE.MathUtils.randFloatSpread(1800);
                    mesh.position.y = THREE.MathUtils.randFloatSpread(1200);
                }
            });

            renderer.render(scene, camera);
        }

        function startSubtitles() {
            const textContent = document.getElementById('text-content');
            
            const animateNextSentence = () => {
                if (currentSubtitleIdx >= projectionScript.length) {
                    currentSubtitleIdx = 0; 
                }
                
                textContent.innerText = projectionScript[currentSubtitleIdx];
                
                if(textAnimationTl) textAnimationTl.kill();
                textAnimationTl = gsap.timeline({
                    onComplete: () => {
                        currentSubtitleIdx++;
                        setTimeout(animateNextSentence, 2000); 
                    }
                });

                textAnimationTl.fromTo(textContent, 
                    { opacity: 0, scale: 0.6, filter: "blur(20px)" },
                    { opacity: 1, scale: 1, filter: "blur(0px)", duration: 4, ease: "power2.out" }
                )
                .to(textContent, { scale: 1.15, duration: 4, ease: "none" })
                .to(textContent, { 
                    scale: 2.5, 
                    opacity: 0, 
                    filter: "blur(15px)", 
                    duration: 3.5, 
                    ease: "power2.in" 
                });
            };

            setTimeout(animateNextSentence, 2000);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
